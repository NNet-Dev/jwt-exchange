[package]
name = "jwt-exchange"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "JWT validation, transformation, and exchange service"

[dependencies]
# HTTP framework
actix-web = "4"
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

# JWT handling (validation + signing)
jsonwebtoken = "9"

# HTTP client (JWKS fetch, Splunk HEC export)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
dotenvy = "0.15"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "2"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }
# UUID (for JTI generation)
uuid = { version = "1", features = ["v4"] }

sha2 = "0.10"
hex = "0.4"

# F18: Middleware utilities
futures = "0.3"

# RSA key generation (self-signed keypairs at startup)
# `aws_lc_rs` feature uses AWS LC pure-Rust backend (musl-compatible)
rcgen = { version = "0.13", features = ["pem", "aws_lc_rs"], default-features = false }

[dev-dependencies]
actix-rt = "2"
